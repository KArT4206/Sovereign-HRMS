<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sovereign HRMS</title>
<style>:root{--bg:#f6f8fc;--card:#fff;--ink:#0b1c30;--mute:#5b6678;--line:#e2e7f0;--p:#4f46e5}@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111a2e;--ink:#e7edf8;--mute:#a9b6cc;--line:#233150;--p:#8b85ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}main{max-width:1040px;margin:0 auto;padding:48px 16px}h1{font-size:34px;line-height:1.2;margin:0 0 8px}p{color:var(--mute)}a.btn{display:inline-block;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;margin:8px 8px 0 0}a.ghost{background:transparent;color:var(--p);border:1px solid var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:28px}figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}figure img{width:100%;display:block}figcaption{padding:10px 14px;font-size:13px;color:var(--mute)}ul{color:var(--mute)}</style></head>
